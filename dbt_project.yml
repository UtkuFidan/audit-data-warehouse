name: audit_dw
version: "1.0.0"
config-version: 2
profile: audit_dw

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  fiscal_year_start: "2025-01-01"
  fiscal_year_end: "2025-12-31"
  # Audit cut-off. Source freshness and the leaver test are measured against it, not the wall clock.
  as_of_date: "2025-12-31"
  approval_limit: 10000
  split_floor_ratio: 0.70
  split_window_days: 7
  bank_window_days: 14
  round_min_amount: 5000
  round_modulus: 1000
  fuzzy_date_days: 7
  fuzzy_name_similarity: 0.92
  benford_min_invoices: 40
  benford_alpha: 0.001

models:
  audit_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
